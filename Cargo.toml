[package]
name = "simulador_sql_davante"
version = "0.1.0"
edition = "2021"
authors = ["Equipo ASIR Davante"]
description = "Simulador SQL Sprint Davante - Tema 7 Consultas BD"

[dependencies]
gpui = "0.2.2"
rusqlite = { version = "0.33.0", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
unicode-segmentation = "1.12"
dirs = "5.0"
